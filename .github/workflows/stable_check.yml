name: check

on:
  push:
    branches:
      - master
      - main   
  pull_request:

env:
  MOON_COVE_REPORT_ENABLED: "1"
  MOON_WASM_NEW_ALLOCATOR: "1"

jobs:
  check:
    strategy:    
      fail-fast: false
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon version
        run: |
          moon version --all

      - name: moon update
        run: |
          moon update

      - name: moon check
        run: |
          moon -C lexer check 
          moon check --deny-warn

      - name: moon info
        run: |
          moon info --target all
          git diff --exit-code

      - name: format diff
        run: |
          moon fmt
          git diff --exit-code

      - name: moon test
        run: |
          moon test --target all

      - name: coverage report
        timeout-minutes: 10
        run: |
          moon test --target wasm --enable-coverage
          moon coverage report -f summary | tee -a "$GITHUB_STEP_SUMMARY"
