name: check

on:
  schedule:
    # Daily at 12:00 Asia/Shanghai (04:00 UTC).
    - cron: '0 4 * * *'
  push:
    branches:
      - master
      - main   
  pull_request:

jobs:
  check:
    if: github.event_name != 'schedule'
    strategy:    
      fail-fast: false
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon version
        run: |
          moon version --all

      - name: moon update
        run: |
          moon update

      - name: moon check
        run: |
          moon -C lexer check 
          moon check --deny-warn

      - name: moon info
        run: |
          moon info --target all
          git diff --exit-code

      - name: format diff
        run: |
          moon fmt
          git diff --exit-code

      - name: moon test
        run: |
          moon test --target all

  repo_test:
    name: repo test (${{ matrix.repo }})
    strategy:
      fail-fast: false
      matrix:
        repo: [openseek, core, x, typst.mbt, office.mbt, async, moonyacc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon version
        run: moon version --all

      - name: moon update
        run: moon update

      - name: checkout repository corpus
        uses: actions/checkout@v4
        with:
          repository: moonbitlang/${{ matrix.repo }}
          path: .repo-test
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: test repository corpus
        env:
          REPO_ROOT: ${{ github.workspace }}/.repo-test
          REPO_NAME: moonbitlang/${{ matrix.repo }}
        run: |
          echo "$REPO_NAME commit: $(git -C "$REPO_ROOT" rev-parse HEAD)"
          git -C "$REPO_ROOT" submodule status --recursive
          moon test test/repo_test --target native --release --include-skipped
