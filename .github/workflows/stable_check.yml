name: check

on:
  push:
    branches:
      - master
      - main   
  pull_request:

jobs:
  check:
    strategy:    
      fail-fast: false
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon version
        run: |
          moon version --all

      - name: moon update
        run: |
          moon update

      - name: moon check
        run: |
          moon -C lexer check 
          moon check --deny-warn

      - name: moon info
        run: |
          moon info --target all
          git diff --exit-code

      - name: format diff
        run: |
          moon fmt
          git diff --exit-code

      - name: moon test
        run: |
          moon test --target all

      - name: checkout openseek corpus
        uses: actions/checkout@v4
        with:
          repository: moonbitlang/openseek
          ref: main
          path: .openseek
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: test openseek corpus
        env:
          OPENSEEK_ROOT: ${{ github.workspace }}/.openseek
        run: |
          echo "OpenSeek commit: $(git -C "$OPENSEEK_ROOT" rev-parse HEAD)"
          git -C "$OPENSEEK_ROOT" submodule status --recursive
          moon test test/openseek_test/openseek_test.mbt --target native --include-skipped
